<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Summer">
<meta name="theme-color" content="#FF7A45">
<title>Summer · 找个狗友一起撒欢</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>

<div class="phone-frame">
  <div class="app">
    <div class="notch"></div>
    <!-- status bar -->
    <div class="statusbar">
      <span id="sb-time">9:41</span>
      <div class="sb-right">
        <div class="sb-icons">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 10.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM4.2 6.8a5.4 5.4 0 0 1 7.6 0l1.4-1.4a7.4 7.4 0 0 0-10.4 0zM1.4 4a9.4 9.4 0 0 1 13.2 0L16 2.6a11.4 11.4 0 0 0-16 0z"/></svg>
        </div>
        <div class="battery"><i></i></div>
      </div>
    </div>

    <!-- screens -->
    <div class="screens">
      <section class="screen active" id="screen-discover"><div class="scroll" id="discover-scroll"></div></section>
      <section class="screen" id="map-screen"></section>
      <section class="screen" id="screen-post"><div class="scroll" id="post-scroll"></div></section>
      <section class="screen" id="screen-messages"><div class="scroll" id="messages-scroll"></div></section>
      <section class="screen" id="screen-profile"><div class="scroll" id="profile-scroll"></div></section>
    </div>

    <!-- tab bar -->
    <nav class="tabbar">
      <div class="tab active" data-tab="discover">
        <span id="ti-home"></span><span class="tl">发现</span>
      </div>
      <div class="tab" data-tab="map">
        <span id="ti-map"></span><span class="tl">地图</span>
      </div>
      <div class="tab tab-post" data-tab="post">
        <div class="post-fab"><span id="ti-plus"></span></div><span class="tl">发起</span>
      </div>
      <div class="tab" data-tab="messages">
        <span id="ti-chat"></span><span class="tl">消息</span><span class="badge">2</span>
      </div>
      <div class="tab" data-tab="profile">
        <span id="ti-user"></span><span class="tl">我的</span>
      </div>
    </nav>

    <!-- chat detail (full-screen overlay above tab bar) -->
    <div class="chat-view" id="chat-view"></div>

    <!-- overlays -->
    <div class="overlay" id="overlay"></div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<div class="preview-note">📱 Summer · 交互演示版 · 点击各处体验完整流程</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  // inject tab icons after ICON is available
  document.getElementById('ti-home').innerHTML  = ICON.tabHome;
  document.getElementById('ti-map').innerHTML   = ICON.tabMap;
  document.getElementById('ti-plus').innerHTML  = ICON.plus;
  document.getElementById('ti-chat').innerHTML  = ICON.tabChat;
  document.getElementById('ti-user').innerHTML  = ICON.tabUser;
</script>
</body>
</html>
